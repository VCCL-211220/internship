name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: neural_network_2/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check backend syntax
        working-directory: neural_network_2/backend
        run: |
          python -m py_compile app.py neural_network.py tools.py

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: neural_network_2/frontend
        run: npm install

      - name: Build frontend
        working-directory: neural_network_2/frontend
        run: npm run build